name: CodeEvolve CI gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CodeEvolve
        run: pip install -e ".[dev]"
      - name: Analyze
        env:
          CODEEVOLVE_TAXONOMY_HEURISTIC: "1"
          CODEEVOLVE_SKIP_HF: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m codeevolve --repo . --model-tier slm analyze \
            --max-commits 200 \
            --no-ensure-slm \
            --out codeevolve_report.json \
            --report-out codeevolve_repo_report.md \
            --refactor-out codeevolve_refactor.md \
            --dashboard-out codeevolve_dashboard.html
      - name: Synthetic evaluation
        env:
          CODEEVOLVE_TAXONOMY_HEURISTIC: "1"
          CODEEVOLVE_SKIP_HF: "1"
          CODEEVOLVE_SKIP_EMBED: "1"
        run: python -m codeevolve evaluate --suite synthetic --md-out eval_synthetic.md
      - name: CI gate
        env:
          CODEEVOLVE_TAXONOMY_HEURISTIC: "1"
          CODEEVOLVE_SKIP_HF: "1"
        run: python -m codeevolve ci --report codeevolve_report.json --min-stability 0.25
      - name: PR comment body
        if: github.event_name == 'pull_request'
        run: |
          python -m codeevolve comment --report codeevolve_report.json --out pr_comment.md
          cat pr_comment.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: codeevolve-artifacts
          path: |
            codeevolve_report.json
            codeevolve_repo_report.md
            codeevolve_refactor.md
            codeevolve_dashboard.html
            pr_comment.md
