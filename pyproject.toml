[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeevolve"
version = "0.4.0"
description = "Evaluate code evolution from git history: taxonomy, phylogeny, debt, weaknesses, drafted reports, and evidence-linked refactor plans."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ehallford11714" }]
keywords = ["git", "code-evolution", "technical-debt", "stability", "phylogeny", "embeddings", "refactor"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Development Status :: 3 - Alpha",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build", "twine"]
embed = ["numpy>=1.24"]
hf = ["transformers>=4.40", "torch", "accelerate"]
cloud = []
all = ["codeevolve[dev,embed,hf]"]

[project.scripts]
codeevolve = "codeevolve.cli:main"

[project.urls]
Homepage = "https://github.com/ehallford11714/codeevolve"
Repository = "https://github.com/ehallford11714/codeevolve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codeevolve = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
