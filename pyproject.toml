[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeevolve"
version = "0.8.0"
description = "Code evolution analysis with Word2Vec change semantics, Chroma/Pinecone taxonomy, hypothesis panels, and CI/PR gates."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ehallford11714" }]
keywords = ["git", "code-evolution", "technical-debt", "stability", "phylogeny", "embeddings", "refactor", "slm"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Development Status :: 3 - Alpha",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build", "twine"]
embed = ["numpy>=1.24", "sentence-transformers>=2.2"]
gensim = ["gensim>=4.3"]
chroma = ["chromadb>=0.5"]
pinecone = ["pinecone>=5.0"]
semantic = ["codeevolve[gensim,chroma]"]
hf = ["transformers>=4.40", "torch", "accelerate"]
treesitter = ["tree_sitter_languages>=1.10"]
all = ["codeevolve[dev,embed,hf,treesitter,gensim,chroma,pinecone]"]

[project.scripts]
codeevolve = "codeevolve.cli:main"

[project.urls]
Homepage = "https://github.com/ehallford11714/codeevolve"
Repository = "https://github.com/ehallford11714/codeevolve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codeevolve = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
